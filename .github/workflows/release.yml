name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: slate
  # Shrink the shipped binary here only; local `cargo build --release` stays
  # unstripped and fast.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # Pinned to match rust-toolchain.toml; this toolchain builds the exe
        # users download.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # A release runs on a fresh tag ref, so anything saved here is
          # unreachable by every future run - restore is fine for re-runs of
          # the same tag, but never write.
          save-if: false

      # One job builds both arches so a single SHA256SUMS can cover them.
      # Asset names follow Windows arch wording: slate-vX-x64.exe and
      # slate-vX-arm64.exe.
      - name: Build x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build arm64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          $map = [ordered]@{
            "x86_64-pc-windows-msvc" = "x64"
            "aarch64-pc-windows-msvc" = "arm64"
          }
          $lines = foreach ($target in $map.Keys) {
            $name = "$env:BIN-$tag-$($map[$target])"
            Copy-Item "target/$target/release/$env:BIN.exe" "$name.exe"
            "$((Get-FileHash "$name.exe" -Algorithm SHA256).Hash.ToLower())  $name.exe"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS
          "asset_name=$env:BIN-$tag-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "asset_name_arm64=$env:BIN-$tag-arm64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "${{ env.asset_name }}.exe" "${{ env.asset_name_arm64 }}.exe" "SHA256SUMS" --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.asset_name }}
          path: |
            ${{ env.asset_name }}.exe
            ${{ env.asset_name_arm64 }}.exe
            SHA256SUMS
