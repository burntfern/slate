name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: slate
  TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          $name = "$env:BIN-$tag-$env:TRIPLE"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/$env:BIN.exe" "dist/$env:BIN.exe"
          Compress-Archive -Path "dist/$env:BIN.exe" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii SHA256SUMS
          "asset_name=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "${{ env.asset_name }}.zip" "SHA256SUMS" --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset_name }}
          path: |
            ${{ env.asset_name }}.zip
            SHA256SUMS
