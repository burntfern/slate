name: Deny

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
