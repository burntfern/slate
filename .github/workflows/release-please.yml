name: Release Please

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT (secret RELEASE_PLEASE_TOKEN) is required for the tag/release this
      # action creates to trigger release.yml; events raised by the default
      # GITHUB_TOKEN do not start further workflow runs. Falls back to
      # GITHUB_TOKEN so the PR flow still works without the secret.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
