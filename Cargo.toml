[package]
name = "slate"
version = "0.3.0"
edition = "2021"
authors = ["Divyanshu Dhruv"]
description = "Real tabs for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/divyanshudhruv/slate"
readme = "README.md"
publish = false
keywords = ["tabs", "windows", "window-manager", "gpui", "desktop"]
categories = ["gui", "os::windows"]

[dependencies]
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "c35fdac2e35c300a5e25b36aa6163f1bc9dbaad4" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
image = "0.25"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
embed-resource = "3.0.12"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[profile.dev]
debug = "line-tables-only"

