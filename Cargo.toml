[package]
name = "slate"
version = "0.2.0"
edition = "2021"
authors = ["Divyanshu Dhruv"]
description = "Real tabs for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/divyanshudhruv/slate"
readme = "README.md"
publish = false
keywords = ["tabs", "windows", "window-manager", "gpui", "desktop"]
categories = ["gui", "os::windows"]

[dependencies]
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
image = "0.25"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0.12"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[profile.dev]
# Debug info is most of the target directory. Line tables keep backtraces
# readable while cutting link time and disk use; CI pins the same value.
debug = "line-tables-only"

