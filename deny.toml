[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436", # paste - unmaintained
    "RUSTSEC-2026-0206", # rustybuzz - unmaintained
    "RUSTSEC-2026-0192", # ttf-parser - unmaintained
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "NCSA",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "bzip2-1.0.6",
    "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = ["https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components"]
